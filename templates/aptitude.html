<!DOCTYPE html>
<html>
<head>
    <title>Aptitude Test - Placement Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .question {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .question h3 {
            margin-top: 0;
        }

        input[type="radio"] {
            margin-right: 8px;
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            background: #777;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🧠 Aptitude Test</h1>
        <p>Test your basic aptitude skills</p>
    </div>

    <div class="container">

        <form method="POST">

            <div class="question">
                <h3>1. What is 15 + 25?</h3>

                <label>
                    <input type="radio" name="q1" value="30" required>
                    30
                </label><br>

                <label>
                    <input type="radio" name="q1" value="40">
                    40
                </label><br>

                <label>
                    <input type="radio" name="q1" value="50">
                    50
                </label>
            </div>


            <div class="question">
                <h3>2. What is 12 × 5?</h3>

                <label>
                    <input type="radio" name="q2" value="50" required>
                    50
                </label><br>

                <label>
                    <input type="radio" name="q2" value="60">
                    60
                </label><br>

                <label>
                    <input type="radio" name="q2" value="70">
                    70
                </label>
            </div>


            <div class="question">
                <h3>3. If a = 10 and b = 20, what is a + b?</h3>

                <label>
                    <input type="radio" name="q3" value="20" required>
                    20
                </label><br>

                <label>
                    <input type="radio" name="q3" value="30">
                    30
                </label><br>

                <label>
                    <input type="radio" name="q3" value="40">
                    40
                </label>
            </div>


            <div class="question">
                <h3>4. What is 100 ÷ 4?</h3>

                <label>
                    <input type="radio" name="q4" value="20" required>
                    20
                </label><br>

                <label>
                    <input type="radio" name="q4" value="25">
                    25
                </label><br>

                <label>
                    <input type="radio" name="q4" value="30">
                    30
                </label>
            </div>


            <div class="question">
                <h3>5. What comes next: 2, 4, 6, 8, ?</h3>

                <label>
                    <input type="radio" name="q5" value="9" required>
                    9
                </label><br>

                <label>
                    <input type="radio" name="q5" value="10">
                    10
                </label><br>

                <label>
                    <input type="radio" name="q5" value="12">
                    12
                </label>
            </div>


            <button type="submit">
                Submit Test
            </button>

            <button type="button"
                    class="back"
                    onclick="location.href='/dashboard'">
                Back to Dashboard
            </button>

        </form>

    </div>

</body>
</html>
